<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 950" width="100%" height="100%" style="background-color: #0b0f19; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  
  <defs>
    <linearGradient id="grad-matrix" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a202c"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="grad-membrana" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="grad-nucleo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="grad-tormentas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- FONDO CON RETÍCULA TÉCNICA -->
  <rect width="1400" height="950" fill="#0b0f19" />
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <path d="M 0,100 L 1400,100 M 0,200 L 1400,200 M 0,300 L 1400,300 M 0,400 L 1400,400 M 0,500 L 1400,500 M 0,600 L 1400,600 M 0,700 L 1400,700 M 0,800 L 1400,800" />
    <path d="M 100,0 L 100,950 M 200,0 L 200,950 M 300,0 L 300,950 M 400,0 L 400,950 M 500,0 L 500,950 M 600,0 L 600,950 M 700,0 L 700,950 M 800,0 L 800,950 M 900,0 L 900,950 M 1000,0 L 1000,950 M 1100,0 L 1100,950 M 1200,0 L 1200,950 M 1300,0 L 1300,950" />
  </g>

  <!-- HEADER / CABECERA LIMPIA -->
  <text x="50" y="65" font-size="32" font-weight="900" fill="#ffffff" letter-spacing="2">PROYECTO RUDIS</text>
  <text x="50" y="92" font-size="13" fill="#94a3b8">Sistema Operativo de Habitabilidad Divergente y Gobernanza Autónoma</text>
  
  <line x1="50" y1="110" x2="1350" y2="110" stroke="#334155" stroke-width="2"/>

  <!-- CONEXIONES Y FLUJOS -->
  <path d="M 280,310 L 330,310" stroke="#64748b" stroke-width="3" stroke-dasharray="6,6" />
  <path d="M 610,310 L 660,310" stroke="#10b981" stroke-width="3" />
  <path d="M 940,310 L 990,310" stroke="#10b981" stroke-width="3" />
  
  <!-- Flujo de Rechazo -->
  <path d="M 800,430 L 800,480 L 200,480 L 200,390" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="410" y="472" font-size="11" fill="#f87171" font-weight="700">RECHAZO DE TOXINAS / DEVOLUCIÓN AL VACÍO</text>

  <!-- Flujo de Auditoría -->
  <path d="M 800,610 L 800,530" stroke="#f59e0b" stroke-dasharray="4,4" stroke-width="2"/>
  <path d="M 1140,610 L 1140,530" stroke="#f59e0b" stroke-dasharray="4,4" stroke-width="2"/>

  <!-- 01. EL EXTERIOR -->
  <g transform="translate(50, 150)">
    <rect width="230" height="240" rx="12" fill="url(#grad-matrix)" stroke="#334155" stroke-width="2"/>
    <text x="20" y="30" font-size="11" font-weight="700" fill="#64748b" letter-spacing="1">01. EL EXTERIOR</text>
    <text x="20" y="52" font-size="18" font-weight="800" fill="#f1f5f9">La Matrix</text>
    
    <rect x="15" y="70" width="200" height="42" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="25" y="88" font-size="12" font-weight="700" fill="#cbd5e1">Talento e IDIs</text>
    <text x="25" y="102" font-size="10" fill="#64748b">Refugiados / Constructores</text>

    <rect x="15" y="120" width="200" height="42" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="25" y="138" font-size="12" font-weight="700" fill="#cbd5e1">Código y Recursos</text>
    <text x="25" y="152" font-size="10" fill="#64748b">Licencias / Infraestructura</text>

    <rect x="15" y="170" width="200" height="42" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="25" y="188" font-size="12" font-weight="700" fill="#f87171">Ruido y Entropía</text>
    <text x="25" y="202" font-size="10" fill="#64748b">Burocracia / Toxinas</text>
  </g>

  <!-- 02. LA MEMBRANA -->
  <g transform="translate(330, 150)">
    <rect width="280" height="240" rx="12" fill="url(#grad-membrana)" stroke="#475569" stroke-width="2"/>
    <text x="20" y="30" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1">02. LA MEMBRANA</text>
    <text x="20" y="52" font-size="18" font-weight="800" fill="#ffffff">Pasarelas de Entrada</text>

    <rect x="15" y="75" width="250" height="65" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="25" y="98" font-size="13" font-weight="700" fill="#38bdf8">Gremio de Peticiones</text>
    <text x="25" y="115" font-size="11" fill="#94a3b8">Punto de contacto e ingesta</text>
    <text x="25" y="128" font-size="11" fill="#94a3b8">de solicitudes cívicas.</text>

    <rect x="15" y="150" width="250" height="65" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="25" y="173" font-size="13" font-weight="700" fill="#38bdf8">Oficina del Sheriff</text>
    <text x="25" y="190" font-size="11" fill="#94a3b8">Lectura de contexto, diplomacia</text>
    <text x="25" y="203" font-size="11" fill="#94a3b8">preventiva y avisos.</text>
  </g>

  <!-- 03. DIGESTIÓN SELECTIVA -->
  <g transform="translate(660, 150)">
    <rect width="280" height="240" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="2" filter="url(#glow)"/>
    <text x="20" y="30" font-size="11" font-weight="700" fill="#34d399" letter-spacing="1">03. DIGESTIÓN SELECTIVA</text>
    <text x="20" y="52" font-size="18" font-weight="800" fill="#ffffff">Filtro Metabólico</text>

    <rect x="15" y="75" width="250" height="65" rx="8" fill="#022c22" stroke="#059669"/>
    <text x="25" y="98" font-size="13" font-weight="700" fill="#6ee7b7">Nutrientes (Asimilable)</text>
    <text x="25" y="115" font-size="11" fill="#a7f3d0">Talento cívico, código limpio,</text>
    <text x="25" y="128" font-size="11" fill="#a7f3d0">conocimiento e integración.</text>

    <rect x="15" y="150" width="250" height="65" rx="8" fill="#450a0a" stroke="#dc2626"/>
    <text x="25" y="173" font-size="13" font-weight="700" fill="#fca5a5">Toxinas (Descarte)</text>
    <text x="25" y="190" font-size="11" fill="#fecaca">Sistemas abusivos, capturas,</text>
    <text x="25" y="203" font-size="11" fill="#fecaca">interés destructivo y ruido.</text>
  </g>

  <!-- 04. EL NÚCLEO CÍVICO -->
  <g transform="translate(990, 150)">
    <rect width="310" height="360" rx="12" fill="url(#grad-nucleo)" stroke="#10b981" stroke-width="2"/>
    <text x="20" y="30" font-size="11" font-weight="700" fill="#a7f3d0" letter-spacing="1">04. EL NÚCLEO CÍVICO</text>
    <text x="20" y="52" font-size="20" font-weight="800" fill="#ffffff">Soberanía Rudis</text>

    <rect x="15" y="75" width="280" height="75" rx="8" fill="#064e3b" stroke="#10b981"/>
    <text x="25" y="98" font-size="14" font-weight="800" fill="#ffffff">ASAMBLEA GENERAL</text>
    <text x="25" y="116" font-size="11" fill="#6ee7b7">Único órgano soberano absoluto.</text>
    <text x="25" y="130" font-size="11" fill="#6ee7b7">Otorga derechos y aprueba Canon.</text>

    <rect x="15" y="165" width="280" height="75" rx="8" fill="#022c22" stroke="#059669"/>
    <text x="25" y="188" font-size="13" font-weight="700" fill="#34d399">Gremio de Construcción</text>
    <text x="25" y="206" font-size="11" fill="#a7f3d0">Desarrollo de sustrato, código</text>
    <text x="25" y="220" font-size="11" fill="#a7f3d0">líquido y expansión técnica.</text>

    <rect x="15" y="255" width="280" height="75" rx="8" fill="#022c22" stroke="#059669"/>
    <text x="25" y="278" font-size="13" font-weight="700" fill="#34d399">Zonas de Resonancia</text>
    <text x="25" y="296" font-size="11" fill="#a7f3d0">Espacios de habitabilidad para</text>
    <text x="25" y="310" font-size="11" fill="#a7f3d0">entidades y culturas divergentes.</text>
  </g>

  <!-- 05. PALACIO DE TORMENTAS -->
  <g transform="translate(330, 610)">
    <rect width="970" height="210" rx="12" fill="url(#grad-tormentas)" stroke="#ef4444" stroke-width="2"/>
    <text x="30" y="35" font-size="11" font-weight="700" fill="#fca5a5" letter-spacing="2">05. DEFECTO Y AUDITORÍA ESTRUCTURAL</text>
    <text x="30" y="62" font-size="22" font-weight="900" fill="#ffffff">EL PALACIO DE TORMENTAS</text>
    <text x="430" y="62" font-size="12" font-weight="700" fill="#f87171">[ DOCTRINA DE LA ESPADA ENFUNDADA ]</text>

    <text x="30" y="92" font-size="12" fill="#fecaca">
      Órgano permanente de auditoría pasiva. No gobierna ni interviene en la vida cotidiana del sistema.
    </text>
    <text x="30" y="112" font-size="12" fill="#fecaca">
      Su única función es detectar la captura institucional, el secuestro semántico del Canon y la pérdida sistémica de habitantes.
    </text>

    <rect x="30" y="135" width="280" height="40" rx="6" fill="#450a0a" stroke="#7f1d1d"/>
    <text x="45" y="160" font-size="11" font-weight="700" fill="#fca5a5">🛡️ Auditoría de Pérdida Sistémica</text>

    <rect x="335" y="135" width="280" height="40" rx="6" fill="#450a0a" stroke="#7f1d1d"/>
    <text x="350" y="160" font-size="11" font-weight="700" fill="#fca5a5">🔍 Antídoto de Secuestro Semántico</text>

    <rect x="640" y="135" width="300" height="40" rx="6" fill="#450a0a" stroke="#7f1d1d"/>
    <text x="655" y="160" font-size="11" font-weight="700" fill="#fca5a5">⚖️ Separación de Poderes e Inmunidad</text>
  </g>

  <!-- FOOTER REORGANIZADO -->
  <line x1="50" y1="870" x2="1350" y2="870" stroke="#334155" stroke-width="1"/>
  <text x="50" y="905" font-size="14" font-style="italic" fill="#10b981" font-weight="600">
    «Rudis no crece vaciando el mundo. Crece construyendo algo que el mundo quiera habitar.»
  </text>
  <text x="1020" y="905" font-size="12" fill="#64748b" font-weight="700">
    PROYECTO RUDIS © 2026 | ARCHITECTURE MAP V1.0
  </text>

</svg>
